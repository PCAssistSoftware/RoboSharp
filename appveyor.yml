version: 1.2.{build}

branches:
  only:
    - dev

image: Visual Studio 2022

environment:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

install:
  - ps: |
      Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
      ./dotnet-install.ps1 -Channel 10.0 -Quality preview
      $env:PATH = "$env:LOCALAPPDATA\Microsoft\dotnet;$env:PATH"
      dotnet --info

build_script:
  - cmd: dotnet restore RoboSharp.sln
  - cmd: dotnet build RoboSharp.sln --configuration Debug
  - cmd: dotnet pack RoboSharp.sln --configuration Release --output nupkg
  
deploy:
- provider: NuGet
  api_key:
    secure: iPtUkccsoDLr8xgpLJMDxVJNZCwEDg/KZCfB/Qjm8EXNO7DCiYYxOCjexaez7Lhp
